schema_version: phase1.v0.1
batch_id: synth-batch-pilot-0001
purpose: First clean-room pilot planning batch; validates seed coverage and admission
  policy before generation.
target_counts:
  seed_contracts: 25
  llm_contract_drafts: 25
  generated_candidates: 100
  manual_review_min: 25
  evas_verified_min: 20
  spectre_shadow_queue_min: 10
  admitted_min: 15
categories:
  L0 EVAS/Spectre Conformance: 4
  Comparator and Decision Circuits: 6
  Measurement Instrumentation Flows: 5
  Sampling and Analog Memory: 5
  Data Converter Models: 5
ood_holdout:
  primary_axis: category
  heldout_categories:
  - Data Converter Models
  secondary_axis: level
  heldout_levels:
  - L2
  policy: Held-out categories and levels are planning targets only until a split manifest
    exists.
admission_policy:
  require_contract_review: true
  require_static_check: true
  require_contamination_clean: true
  require_evas: true
  require_spectre_shadow_for:
  - L2_e2e
  - first_property_type
  - high_reward_samples
  reject_evas_pass_spectre_fail: true
  grpo_prompt_leakage_block: true
  notes:
  - Spectre is a shadow audit gate for this pilot, not a training-time reward loop.
  - Seed candidates must pass contamination review before generation.
notes:
- This manifest defines a pilot target distribution; it does not claim admitted clean-room
  data exists.
- The target is intentionally smaller than Phase 1 bulk targets to support manual
  review.
