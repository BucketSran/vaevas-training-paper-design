id: cg_batch_l1_track_hold_repair_ood_split_naming_0001
schema_version: '0.1'
category: Sampling and Analog Memory
level: L1
task_form: bugfix
base_function: aperture_track_hold_repair_ood_split_naming
domain: voltage
difficulty: medium
intent: A repair task corrects a track-and-hold behavior so the held output reflects
  the input sampled after aperture delay and remains stable between sample events.
  This variant emphasizes OOD-style naming and split-key diversity.
ports:
- name: vin
  direction: input
  discipline: electrical
  role: sampled_input
- name: vclk
  direction: input
  discipline: electrical
  role: sample_clock
- name: vhold
  direction: output
  discipline: electrical
  role: held_output
parameters:
- name: clk_threshold
  unit: V
  default: 0.6
  range:
  - 0.4
  - 0.8
- name: aperture_delay
  unit: s
  default: 2.0e-09
  range:
  - 0.0
  - 5.0e-09
- name: transition_time
  unit: s
  default: 7.5e-10
  range:
  - 1.0e-10
  - 2.0e-09
stimulus_space:
  waveforms:
  - ramped_input_with_clock_edges
  - stepped_input_near_aperture
  - hold_interval_disturbance
  - renamed_interface_ood_case
  sweeps:
    aperture_delay:
    - 0.0
    - 2.0e-09
    - 4.0e-09
    input_slope_v_per_s:
    - 500000.0
    - 2000000.0
    clock_period_s:
    - 2.0e-08
    - 5.0e-08
    variant_focus_index:
    - 5
observables:
- vin_at_aperture
- vhold
- sample_edge_time
- hold_error_v
- repair_error_delta_v
properties:
- id: samples_after_aperture_delay
  type: timing_delay
  description: The held value corresponds to vin evaluated at the clock crossing plus
    aperture delay.
  observables:
  - vin_at_aperture
  - sample_edge_time
  - vhold
  expected:
    sample_time_expression: clock_crossing + aperture_delay
  tolerance_ref: timing_abs_s
- id: holds_between_clock_edges
  type: settling_time
  description: Between sample events the output remains stable aside from the declared
    transition interval.
  observables:
  - vhold
  - hold_error_v
  expected:
    max_hold_drift_v: 0.01
  tolerance_ref: voltage_abs_v
- id: repair_reduces_sampling_error
  type: repair_delta
  description: The repaired artifact reduces aperture sampling error relative to the
    supplied broken behavior.
  observables:
  - repair_error_delta_v
  - hold_error_v
  expected:
    error_delta_sign: negative
    min_abs_improvement_v: 0.02
  tolerance_ref: repair_delta_v
- id: variant_ood_split_naming
  type: event_count
  description: Variant-specific coverage for OOD-style naming and split-key diversity
    remains observable through public signals.
  observables:
  - vin_at_aperture
  - vhold
  expected:
    variant_focus: OOD-style naming and split-key diversity
    public_observables_only: true
  tolerance_ref: voltage_abs_v
