properties:
- id: voltage_logic_interface
  type: state_sequence
  description: Handshake and code outputs are driven as voltage-domain logic signals
    throughout conversion.
  observables:
  - done
  - bit0
  - bit1
  - bit2
  - bit3
  expected:
    logic_output_rails: true
  tolerance_ref: voltage_abs_v
- id: ordered_bit_trials
  type: event_sequence
  description: The SAR decision sequence visits each bit trial from most significant
    to least significant exactly once.
  observables:
  - trial_bit_order
  expected:
    sequence:
    - 3
    - 2
    - 1
    - 0
  tolerance_ref: event_sequence_exact
- id: bounded_conversion_done
  type: event_count
  description: Done asserts once after the expected trial sequence and within allowed
    conversion latency.
  observables:
  - done
  - conversion_latency_cycles
  expected:
    done_edges: 1
    max_cycles: 6
  tolerance_ref: event_count_exact
- id: quantized_code_accuracy
  type: code_mapping
  description: The final voltage-domain code is within one least-significant bit of
    the ideal quantized value.
  observables:
  - bit0
  - bit1
  - bit2
  - bit3
  - code_error_lsb
  expected:
    max_abs_error_lsb: 1
  tolerance_ref: code_error_lsb
- id: variant_observable_clarity
  type: state_sequence
  description: Variant-specific coverage for checker observable clarity remains observable
    through public signals.
  observables:
  - done
  - bit0
  expected:
    variant_focus: checker observable clarity
    public_observables_only: true
  tolerance_ref: voltage_abs_v
