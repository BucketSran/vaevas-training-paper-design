id: cg_batch_l0_cross_event_latch_ood_split_naming_0001
schema_version: '0.1'
category: Comparator and Decision Circuits
level: L0
task_form: conformance
base_function: directional_threshold_event_latch_ood_split_naming
domain: voltage
difficulty: simple
intent: A differential voltage event case observes public threshold crossings and
  latches a rail flag only when the requested crossing direction occurs. This variant
  emphasizes OOD-style naming and split-key diversity.
ports:
- name: vp
  direction: input
  discipline: electrical
  role: positive_crossing_input
- name: vn
  direction: input
  discipline: electrical
  role: negative_reference_input
- name: vflag
  direction: output
  discipline: electrical
  role: latched_event_flag
parameters:
- name: vth
  unit: V
  default: 0.0
  range:
  - -0.04
  - 0.04
- name: vhigh
  unit: V
  default: 1.2
  range:
  - 0.9
  - 1.5
- name: vlow
  unit: V
  default: 0.0
  range:
  - 0.0
  - 0.1
- name: tdetect
  unit: s
  default: 2.0e-10
  range:
  - 0.0
  - 1.0e-09
stimulus_space:
  waveforms:
  - single_rising_differential_ramp
  - single_falling_differential_ramp
  - non_crossing_near_miss
  - renamed_interface_ood_case
  sweeps:
    threshold_offset_v:
    - -0.02
    - 0.0
    - 0.02
    slope_v_per_s:
    - 1000000.0
    - 5000000.0
    - 10000000.0
    variant_focus_index:
    - 5
observables:
- vp_minus_vn
- vflag
- first_cross_time
- accepted_direction
properties:
- id: direction_selectivity
  type: threshold_crossing
  description: Only the requested crossing direction creates an accepted event.
  observables:
  - vp_minus_vn
  - first_cross_time
  expected:
    accepted_direction: rising
  tolerance_ref: event_time_abs_s
- id: rail_latch_bounds
  type: voltage_bounds
  description: The event flag settles to the declared rail after an accepted event.
  observables:
  - vflag
  expected:
    low_v: 0.0
    high_v: 1.2
  tolerance_ref: voltage_abs_v
- id: near_miss_no_event
  type: event_count
  description: Stimuli that approach but do not cross the threshold generate no accepted
    events.
  observables:
  - vp_minus_vn
  - vflag
  expected:
    max_events_without_crossing: 0
  tolerance_ref: event_count_exact
- id: variant_ood_split_naming
  type: event_count
  description: Variant-specific coverage for OOD-style naming and split-key diversity
    remains observable through public signals.
  observables:
  - vp_minus_vn
  - vflag
  expected:
    variant_focus: OOD-style naming and split-key diversity
    public_observables_only: true
  tolerance_ref: voltage_abs_v
forbidden_constructs:
- current_contribution
- branch_current_dependency
- idt
- ddt
- laplace
- noise_operators
- hidden_checker_logic
- hardcoded_testbench_time
- task_id_special_case
tolerances:
  voltage_abs_v: 0.036
  event_time_abs_s: 6.0e-10
  event_count_exact: 0
