  evas_repo: https://github.com/BucketSran/EVAS.git
  evas_branch: codex/stochastic-semantics-and-cross-law
  evas_commit: e1e73c056ceb91dbda47c5029d8b37f57d9c0fa7
  python_env: /data/jinzhihong/envs/vaevas-rl/bin/python
outputs:
