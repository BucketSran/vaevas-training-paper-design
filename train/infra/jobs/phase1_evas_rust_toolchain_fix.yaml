job_id: phase1_evas_rust_toolchain_fix
purpose: >
  Resolve the remote EVAS PR12 profile blocker by installing or exposing a
  user-local Rust toolchain, rebuilding the pinned evas-rust backend, and
  rerunning the clk_div rust smoke. This job does not run training or Spectre.
execution:
  mode: github_mediated_remote_codex
  command: follow train/infra/jobs/REMOTE_CODEX_TASK_EVAS_RUST_TOOLCHAIN_FIX.md
  gpu_required: false
  writes_checkpoints: false
  writes_training_data: false
  runs_spectre: false
  commits_results: true
inputs:
