  required_files:
    - evas_profile.yaml
    - evas_build_report.json
    - commands.log
assertions:
  no_sudo: true
  no_training: true
  no_spectre: true
  no_checkpoints: true
  pinned_commit: e1e73c056ceb91dbda47c5029d8b37f57d9c0fa7
  success_status: built_smoke_tested
  allowed_blocked_status: blocked_missing_rust_toolchain
notes:
